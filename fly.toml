app = "letta-app-server"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  LETTA_BACKEND = "local"
  PORT = "4500"

[http_service]
  internal_port = 4500
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "letta_state"
  destination = "/root/.letta"
