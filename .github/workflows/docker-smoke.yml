name: Docker image smoke test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check entrypoint syntax
        run: sh -n start-computer.sh

      - name: Build deployment image
        run: docker build --tag letta-computer:smoke .

      - name: Verify runtime tools and channel installs
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh letta-computer:smoke -lc '
            set -eu
            command -v node
            command -v npm
            command -v git
            command -v python3
            command -v curl
            command -v wget
            command -v jq
            command -v cron
            command -v crontab
            letta --version
            letta server --help
            letta channels install telegram
            letta channels install discord
            letta channels install slack
            letta channels install whatsapp
          '
