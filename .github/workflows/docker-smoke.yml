name: Docker image smoke test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check entrypoint syntax
        run: sh -n start-app-server.sh

      - name: Build deployment image
        run: docker build --tag letta-app-server:smoke .

      - name: Start App Server
        run: |
          docker run --detach \
            --name letta-app-server \
            --publish 4500:4500 \
            --env LETTA_APP_SERVER_TOKEN=deployment-smoke-token \
            letta-app-server:smoke

      - name: Verify health and authentication
        run: |
          set -euo pipefail
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4500/readyz >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:4500/readyz

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:4500/app-server-info)"
          test "$status" = "401"

          curl --fail --silent \
            --header 'Authorization: Bearer deployment-smoke-token' \
            http://127.0.0.1:4500/app-server-info \
            | jq --exit-status '.type == "app_server_info_response" and .backend == "local"'

      - name: Show App Server logs
        if: failure()
        run: docker logs letta-app-server

      - name: Stop App Server
        if: always()
        run: docker rm --force letta-app-server || true
